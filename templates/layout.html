<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Signs of the Palace{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="royal-header">
        <div class="container">
            <div class="logo">
                <a href="{{ url_for('index') }}">
                    <span class="palace-icon">🏰</span>
                    <span class="logo-text">Signs of the Palace</span>
                </a>
            </div>
            <nav class="royal-nav">
                <ul>
                    <li><a href="{{ url_for('home') }}">Home</a></li>
                    <li><a href="{{ url_for('predict') }}">Predict</a></li>
                    <li><a href="{{ url_for('about_palace') }}">The Palace</a></li>
                    <li><a href="{{ url_for('about_project') }}">The Project</a></li>
                    <li><a href="{{ url_for('contact') }}">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="royal-footer">
        <div class="container">
            <p>&copy; 2026 Signs of the Palace. Preserving Cultural Heritage through AI.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
